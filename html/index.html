<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="playerhud" class="hud hidden">
        <div id="playerhud-id">ID: --</div>
        <div id="playerhud-name">Name: --</div>
        <div id="playerhud-players">Players: 0 / 32</div>
    </div>

    <div id="scoreboard">
        <div id="header" class="sb-hero">
            <div class="sb-hero-main">
                <div class="sb-logo-wrap">
                    <img id="logo" src="" alt="Logo" style="display:none;">
                </div>
                <div class="sb-title">
                    <span class="sb-kicker">Live Roster</span>
                    <div id="servername">Server Name</div>
                </div>
            </div>
            <div class="sb-hero-meta">
                <div id="playercount" class="sb-pill">0 / 32</div>
                <div class="sb-meta-text">Players online</div>
            </div>
        </div>

        <div class="sb-divider"></div>

        <div class="sb-players-container">
            <div id="playerlist" class="players-grid">
            </div>
        </div>

        <div id="pagination" class="pagination-modern">
            <button id="prevPage" class="page-btn">← Previous</button>
            <span id="pageIndicator">Page 1</span>
            <button id="nextPage" class="page-btn">Next →</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
