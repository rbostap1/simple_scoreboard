<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene-shell">
        <div class="scene-grid"></div>
        <div class="scene-orb orb-left"></div>
        <div class="scene-orb orb-right"></div>

        <section id="scoreboard" class="scoreboard-shell">
            <div class="scoreboard-frame"></div>
            <div class="scoreboard-noise"></div>

            <div id="header" class="score-header">
                <div class="header-main">
                    <div class="logo-capsule">
                        <img id="logo" src="" alt="Server logo" style="display:none;">
                        <div id="logoFallback" class="logo-fallback">SB</div>
                    </div>
                    <div class="title-wrap">
                        <div class="eyebrow">Live Roster</div>
                        <div id="servername" class="server-name">Server Name</div>
                        <div class="title-subtext">A polished department board for quick scanning and live status checks.</div>
                    </div>
                </div>
                <div class="header-meta">
                    <div class="count-chip-wrap">
                        <div id="playercount" class="count-chip">0 / 32</div>
                        <div class="count-label">Connected</div>
                    </div>
                </div>
            </div>

            <div class="status-band">
                <div class="status-tile">
                    <span class="status-label">Online</span>
                    <span id="playercountMirror" class="status-value">0 / 32</span>
                </div>
                <div class="status-tile">
                    <span class="status-label">Departments</span>
                    <span id="departmentCount" class="status-value">0</span>
                </div>
            </div>

            <div class="department-strip" id="departmentSummary"></div>

            <div class="players-shell">
                <div id="playerlist" class="players-grid"></div>
            </div>

            <div id="pagination" class="pagination-modern">
                <button id="prevPage" class="page-btn" type="button">Prev</button>
                <span id="pageIndicator">Page 1 / 1</span>
                <button id="nextPage" class="page-btn" type="button">Next</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
